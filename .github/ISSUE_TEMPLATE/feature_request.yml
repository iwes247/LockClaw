name: Feature Request
description: Suggest a new feature or improvement for LockClaw
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make LockClaw better? Describe it below.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve, or what use-case does it enable?
      placeholder: "I'm always frustrated when …"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of LockClaw does this affect?
      options:
        - Security / Hardening
        - OpenClaw Gateway
        - claude-mem / Memory
        - Docker / Build
        - CI / Workflows
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've thought about.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, links, examples, or anything else.
